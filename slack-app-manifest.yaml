# Manifest ready to create the Slack App in one go.
# Go to https://api.slack.com/apps -> "Create New App" -> "From an app manifest"
# and paste this file. After that, you still need to:
#   1. Enable Socket Mode (Settings -> Socket Mode) and generate the App-Level Token
#      with the connections:write scope -> this is the SLACK_APP_TOKEN
#   2. Install the app to the workspace (OAuth & Permissions -> Install to Workspace)
#      -> this generates the SLACK_BOT_TOKEN (Bot User OAuth Token, starts with xoxb-)

display_information:
  name: Translator
  description: Translates channel messages to each person's preferred language
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: translator
    always_online: true
  slash_commands:
    - command: /idioma
      description: Sets your preferred language to receive translations
      usage_hint: "es-mx"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - channels:read
      - groups:read
      - im:read
      - chat:write
      - commands
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
